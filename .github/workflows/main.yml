name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted
          unzip -q Havashenasi6.zip -d extracted

          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project was not found inside Havashenasi6.zip"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "APK file was not created"
            exit 1
          fi

          cp "$APK_FILE" output/Havashenasi6-debug.apk
          ls -lh output/Havashenasi6-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Havashenasi6-APK
          path: output/Havashenasi6-debug.apk
          if-no-files-found: error
